<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Red Devils' Matchday Log</title>
</head>
<body style="margin:0;background:#14110D;color:#EFE4C8;font-family:system-ui,sans-serif">
<div id="boot" style="padding:40px 16px;text-align:center">Loading season companion…</div>
<script type="module">
const N = 3;
const parts = [];
for (let i = 0; i < N; i++) {
  const r = await fetch('./p' + i + '.txt', { cache: 'no-store' });
  if (!r.ok) throw new Error('missing chunk p' + i);
  parts.push(await r.text());
}
const bin = atob(parts.join(''));
const bytes = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
const html = await new Response(stream).text();
document.open();
document.write(html);
document.close();
</script>
</body>
</html>
