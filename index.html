  .highlight-display.empty { color: var(--grey); font-style: italic; }
  .auto-tag { font-size: 10px; color: var(--grey); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .edit-link { font-size: 11px; color: var(--red); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .empty-state { grid-column: 1 / -1; text-align: center; color: var(--grey); padding: 40px 0; font-size: 13px; }
  .err-banner { max-width: 640px; margin: 0 auto 16px; text-align: center; font-size: 12px; color: #c66; }
  canvas.confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
</style>

<script type="module">

const MONTHS = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };

const FIXTURES = [

  {id:29, gw:29, date:'Sat 13 Mar 2027', opp:'Everton', venue:'H', comp:'PL'},
  {id:30, gw:30, date:'Sat 20 Mar 2027', opp:'Manchester City', venue:'A', comp:'PL'},

  {id:35, gw:35, date:'Sat 8 May 2027', opp:'Bournemouth', venue:'A', comp:'PL'},
  {id:36, gw:36, date:'Sat 15 May 2027', opp:'Leeds United', venue:'H', comp:'PL'},
  {id:37, gw:37, date:'Sun 23 May 2027', opp:'Tottenham', venue:'A', comp:'PL'},
  {id:38, gw:38, date:'Sun 30 May 2027', opp:'Fulham', venue:'H', comp:'PL'},
];

const STORAGE_KEY = 'mu-tracker-data-v1';
const DB_PATH = 'records';
const root = document.getElementById('mu-root');

let records = {};
let filter = 'all';
let standings = [];
let muTable = null;
let loadError = null;
let autoImportDone = false;
let recordsRef = null;

try {
  const app = initializeApp(firebaseConfig);
  recordsRef = ref(getDatabase(app), DB_PATH);
} catch (e) {
  loadError = e.message || 'Firebase init failed';
}

function parseFixtureDate(str) {
  const parts = str.trim().split(/\s+/);
  const day = parseInt(parts[1], 10);
  const mon = MONTHS[parts[2]];
  const year = parseInt(parts[3], 10);
  return new Date(year, mon, day);
}
function toYmd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}${m}${day}`;
}
function normalizeName(s) {
  return (s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]/g, '');
}
function namesMatch(a, b) {
  const x = normalizeName(a), y = normalizeName(b);
  return x.includes(y) || y.includes(x) || x === y;
}
function isManUnited(team) {
  const n = (team?.name || team?.displayName || team?.abbreviation || '').toLowerCase();
  return n.includes('manchester united') || n === 'man united' || n === 'man utd' || n === 'mun' || n === 'man';
}

function resultFor(rec) {
  if (rec.mu > rec.opp) return 'W';
  if (rec.mu < rec.opp) return 'L';
  return 'D';
}
function computeStats() {
  let p=0,w=0,d=0,l=0,gf=0,ga=0;
  const streak = [];
  FIXTURES.forEach(f => {
    const rec = records[f.id] || records[String(f.id)];
    if (rec && rec.mu !== undefined && rec.opp !== undefined) {
      p++; gf += Number(rec.mu); ga += Number(rec.opp);
      const r = resultFor(rec);
      if (r==='W') w++; else if (r==='D') d++; else l++;
      streak.push(r);
    }
  });
  return {p,w,d,l,gf,ga,gd:gf-ga,pts:w*3+d, streak: streak.slice(-6)};
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function fireConfetti() {
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#C8102E', '#C6A15B', '#EFE4C8', '#2F5233'];
  const pieces = Array.from({length: 80}, () => ({
    x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.3,
    vy: 2 + Math.random()*3, vx: -1.5 + Math.random()*3,
    size: 4 + Math.random()*5, color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360, vr: -6 + Math.random()*12
  }));
  let frame = 0;
  (function tick() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6); ctx.restore();
    });
    if (++frame < 110) requestAnimationFrame(tick); else canvas.remove();
  })();
}

async function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch (_) {}
  if (recordsRef) {
    await set(recordsRef, records);
  }
}

async function fetchStandings() {
  try {
    const res = await fetch(`${API_BASE}/standings?season=2026`);
    if (!res.ok) return;
    const data = await res.json();
    const entries = data?.children?.[0]?.standings?.entries || [];
    standings = entries.map(e => {
      const stats = {};
      (e.stats || []).forEach(s => { stats[s.name] = s.displayValue; });
      return {
        name: e.team?.displayName || e.team?.name || '?',
        abbr: e.team?.abbreviation || '',
        rank: Number(stats.rank) || 0,
        p: Number(stats.gamesPlayed) || 0,
        w: Number(stats.wins) || 0,
        d: Number(stats.ties) || 0,
        l: Number(stats.losses) || 0,
        gd: Number(stats.pointDifferential) || 0,
        pts: Number(stats.points) || 0,
        isMu: isManUnited(e.team)
      };
    }).sort((a,b) => a.rank - b.rank);
    muTable = standings.find(s => s.isMu) || null;
  } catch (e) {
    console.warn('standings', e);
  }
}

async function autoImportResults() {
  if (autoImportDone) return;
  autoImportDone = true;
  const today = new Date();
  today.setHours(23,59,59,999);
  const toCheck = FIXTURES.filter(f => {
    const d = parseFixtureDate(f.date);
    const rec = records[f.id] || records[String(f.id)];
    const hasResult = rec && rec.mu !== undefined;
    return d <= today && !hasResult;
  });
  const dates = [...new Set(toCheck.map(f => toYmd(parseFixtureDate(f.date))))];
  let changed = false;

  for (const ymd of dates) {
    try {
      const res = await fetch(`${API_BASE}/scoreboard?dates=${ymd}`);
      if (!res.ok) continue;
      const data = await res.json();
      const events = data.events || [];
      for (const ev of events) {
        const comps = ev.competitions || [];
        for (const c of comps) {
          const competitors = c.competitors || [];
          const mu = competitors.find(x => isManUnited(x.team));
          if (!mu) continue;
          const status = c.status?.type;
          if (!status?.completed && status?.name !== 'STATUS_FULL_TIME') continue;
          const oppSide = competitors.find(x => x !== mu);
          const muScore = Number(mu.score);
          const oppScore = Number(oppSide?.score);
          if (Number.isNaN(muScore) || Number.isNaN(oppScore)) continue;
          const oppName = oppSide?.team?.displayName || oppSide?.team?.name || '';
          const fixture = FIXTURES.find(f => toYmd(parseFixtureDate(f.date)) === ymd && namesMatch(f.opp, oppName));
          if (!fixture) continue;
          const key = String(fixture.id);
          const existing = records[key];
          if (existing && existing.mu !== undefined) continue;
          const venue = mu.homeAway === 'home' ? 'Home' : 'Away';
          const hl = `Full time · ${oppName} ${oppScore}–${muScore} Man United (${venue}). Auto-imported.`;
          records[key] = { mu: muScore, opp: oppScore, highlight: hl, auto: true };
          changed = true;
        }
      }
    } catch (e) {
      console.warn('auto import', ymd, e);
    }
  }
  if (changed) {
    try { await saveData(); } catch (e) { console.warn(e); }
  }
}

function nextUnplayed() {
  return FIXTURES.find(f => {
    const rec = records[f.id] || records[String(f.id)];
    return !(rec && rec.mu !== undefined);
  }) || null;
}

function buildupNotes(next) {
  if (!next) return ['Season complete — review the log and plan the summer.'];
  const d = parseFixtureDate(next.date);
  const now = new Date();
  now.setHours(0,0,0,0);
  const days = Math.round((d - now) / 86400000);
  const home = next.venue === 'H';
  const notes = [];
  if (days < 0) notes.push(`GW${next.gw} vs ${next.opp} is past kick-off — scores will auto-fill when the result posts.`);
  else if (days === 0) notes.push(`Matchday. ${home ? 'Old Trafford' : 'Away day'} vs ${next.opp}. Light activation, travel ready, set-piece walk-through.`);
  else if (days === 1) notes.push(`MD-1: taper volume. Rondo + finishing, rest legs, final set-piece walkthrough.`);
  else if (days <= 3) notes.push(`MD-${days}: midweek intensity. Recovery from last game, then sharpness work and shape vs ${next.opp}.`);
  else notes.push(`${days} days until ${home ? 'home' : 'away'} vs ${next.opp}. Build aerobic base early in the week; intensity rises closer to MD.`);
  if (muTable) {
    notes.push(`Table: ${muTable.rank}${ordinal(muTable.rank)} · ${muTable.pts} pts · GD ${muTable.gd >= 0 ? '+' : ''}${muTable.gd} after ${muTable.p} played.`);
  }
  notes.push(home
    ? `Home focus: control transitions, crowd energy after the whistle, first 15 minutes intensity.`
    : `Away focus: compact block, set-piece discipline (lesson from Hull), counter windows.`);
  notes.push(`Training week template: Mon recovery · Tue tactical shape · Wed power/speed · Thu unit work · Fri activation.`);
  return notes;
}
function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return s[(v - 20) % 10] || s[v] || s[0];
}

function renderBuildup() {
  const next = nextUnplayed();
  const notes = buildupNotes(next);
  const tableRows = (standings.length ? standings : []).slice(0, 8).map(s => `
    <tr class="${s.isMu ? 'mu' : ''}">
      <td class="pos">${s.rank}</td>
      <td>${escapeHtml(s.name)}${s.isMu ? ' ★' : ''}</td>
      <td class="num">${s.p}</td>
      <td class="num">${s.gd >= 0 ? '+' : ''}${s.gd}</td>
      <td class="pts">${s.pts}</td>
    </tr>
  `).join('');

  let extra = '';
  if (muTable && muTable.rank > 8) {
    extra = `
    <tr class="mu">
      <td class="pos">${muTable.rank}</td>
      <td>${escapeHtml(muTable.name)} ★</td>
      <td class="num">${muTable.p}</td>
      <td class="num">${muTable.gd >= 0 ? '+' : ''}${muTable.gd}</td>
      <td class="pts">${muTable.pts}</td>
    </tr>`;
  }

  return `
    <div class="buildup">
      <div class="panel">
        <h2>Premier League table</h2>
        ${standings.length ? `
        <table class="standings-table">
          <thead><tr><th class="pos">#</th><th>Club</th><th class="num">P</th><th class="num">GD</th><th class="pts">Pts</th></tr></thead>
          <tbody>${tableRows}${extra}</tbody>
        </table>` : `<div style="color:var(--grey);font-size:12px;">Loading standings…</div>`}
      </div>
      <div class="panel">
        <h2>Matchday build-up</h2>
        ${next ? `
          <div class="next-match-line">Next · GW${next.gw} vs ${escapeHtml(next.opp)}</div>
          <div class="next-meta">${escapeHtml(next.date)} · ${next.venue === 'H' ? 'Home' : 'Away'} · ${next.comp}</div>
        ` : `<div class="next-match-line">No fixtures left</div>`}
        <ul class="buildup-notes">
          ${notes.map(n => `<li>${escapeHtml(n)}</li>`).join('')}
        </ul>
      </div>
    </div>
  `;
}

function renderTicket(f) {
  const rec = records[f.id] || records[String(f.id)];
  const played = rec && rec.mu !== undefined;
  const venueLabel = f.venue === 'H' ? 'Home' : 'Away';
  if (played) {
    const r = resultFor(rec);
    return `
      <div class="ticket">
        <div class="stub">GW ${f.gw} · ${f.comp}</div>
        <div class="body stamp-block">
          <div class="result-stamp ${r}">${r==='W'?'WIN':r==='D'?'DRAW':'LOSS'}</div>
          <div class="row1"><span class="gw">Matchday ${f.gw}</span><span class="comp">${f.comp === 'PL' ? 'Prem' : f.comp}</span></div>
          <div class="date">${f.date} · ${venueLabel}</div>
          <div class="fixture-line">Man United <span class="venue-tag">${f.venue}</span> vs ${f.opp}</div>
          <div class="final-score">${rec.mu} – ${rec.opp}</div>
          ${rec.auto ? '<div class="auto-tag">Auto score</div>' : ''}
          <div class="highlight-display ${rec.highlight ? '' : 'empty'}">${rec.highlight ? escapeHtml(rec.highlight) : 'No highlight noted.'}</div>
          <button class="edit-link" id="edit-${f.id}">Edit result</button>
        </div>
      </div>`;
  }
  return `
    <div class="ticket">
      <div class="stub">GW ${f.gw} · ${f.comp}</div>
      <div class="body">
        <div class="row1"><span class="gw">Matchday ${f.gw}</span><span class="comp">${f.comp === 'PL' ? 'Prem' : f.comp}</span></div>
        <div class="date">${f.date} · ${venueLabel}</div>
        <div class="fixture-line">Man United <span class="venue-tag">${f.venue}</span> vs ${f.opp}</div>
        <div class="score-form">
          <span class="mu-mono">MUFC</span>
          <input type="number" min="0" id="mu-${f.id}" placeholder="-" />
          <span class="vs">:</span>
          <input type="number" min="0" id="opp-${f.id}" placeholder="-" />
          <span class="mu-mono">${escapeHtml(f.opp).slice(0,4).toUpperCase()}</span>
        </div>
        <textarea class="highlight-input" id="hl-${f.id}" placeholder="Highlights, scorers, Man of the Match...">${rec && rec.highlight ? escapeHtml(rec.highlight) : ''}</textarea>
        <button class="save-btn" id="save-${f.id}">Stamp result</button>
      </div>
    </div>`;
}

function render() {
  const stats = computeStats();
  const visible = FIXTURES.filter(f => {
    const rec = records[f.id] || records[String(f.id)];
    const played = rec && rec.mu !== undefined;
    if (filter === 'played') return played;
    if (filter === 'upcoming') return !played;
    return true;
  });

  root.innerHTML = `
    <div class="mu-header">
      <div class="eyebrow">Traouse Presents</div>
      <h1 class="mu-display">The Red <span>Devils'</span> Matchday Log</h1>
      <div class="season">2026/27 Premier League · scores auto-update when results post</div>
    </div>
    ${loadError ? `<div class="err-banner">${escapeHtml(loadError)}</div>` : ''}
    <div class="scoreboard">
      <div class="flip"><div class="val">${stats.p}</div><div class="lab">Played</div></div>
      <div class="flip"><div class="val">${stats.w}</div><div class="lab">Won</div></div>
      <div class="flip"><div class="val">${stats.d}</div><div class="lab">Drawn</div></div>
      <div class="flip"><div class="val">${stats.l}</div><div class="lab">Lost</div></div>
      <div class="flip"><div class="val">${stats.gf}</div><div class="lab">Goals For</div></div>
      <div class="flip"><div class="val">${stats.ga}</div><div class="lab">Goals Against</div></div>
      <div class="flip"><div class="val">${stats.gd>0?'+':''}${stats.gd}</div><div class="lab">Gl Diff</div></div>
      <div class="flip"><div class="val">${stats.pts}</div><div class="lab">Points</div></div>
    </div>
    <div class="streak-line">
      Current form
      <span class="pips">${stats.streak.length ? stats.streak.map(r=>`<span class="pip ${r}">${r}</span>`).join('') : '<span style="color:var(--grey);font-size:11px;">no results yet</span>'}</span>
    </div>
    ${renderBuildup()}
    <div class="tabs">
      <button class="tab ${filter==='all'?'active':''}" data-f="all">All 38</button>
      <button class="tab ${filter==='played'?'active':''}" data-f="played">Played (${stats.p})</button>
      <button class="tab ${filter==='upcoming'?'active':''}" data-f="upcoming">Upcoming (${38-stats.p})</button>
    </div>
    <div class="tickets">
      ${visible.length ? visible.map(renderTicket).join('') : '<div class="empty-state">Nothing here yet.</div>'}
    </div>
  `;

  root.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => { filter = btn.dataset.f; render(); });
  });
  visible.forEach(f => {
    const saveBtn = root.querySelector(`#save-${f.id}`);
    const editBtn = root.querySelector(`#edit-${f.id}`);
    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        const muVal = root.querySelector(`#mu-${f.id}`).value;
        const oppVal = root.querySelector(`#opp-${f.id}`).value;
        const hlVal = root.querySelector(`#hl-${f.id}`).value;
        if (muVal === '' || oppVal === '') return;
        saveBtn.disabled = true;
        records[String(f.id)] = { mu: Number(muVal), opp: Number(oppVal), highlight: hlVal, auto: false };
        try {
          await saveData();
          render();
          if (resultFor(records[String(f.id)]) === 'W') fireConfetti();
        } catch (_) { saveBtn.disabled = false; }
      });
    }
    if (editBtn) {
      editBtn.addEventListener('click', async () => {
        const key = String(f.id);
        delete records[key];
        await saveData();
        render();
      });
    }
  });
}

async function boot() {
  render();
  if (recordsRef) {
    onValue(recordsRef, async (snap) => {
      const val = snap.val();
      records = val && typeof val === 'object' ? val : {};
      const normalised = {};
      Object.keys(records).forEach(k => { normalised[String(k)] = records[k]; });
      records = normalised;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); } catch (_) {}
      render();
      await fetchStandings();
      await autoImportResults();
      render();
    }, (err) => {
      loadError = err.message || 'Firebase read failed';
      render();
    });
  } else {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) records = JSON.parse(raw);
    } catch (_) {}
    await fetchStandings();
    await autoImportResults();
    render();
  }
}

boot();
</script>
</body>
</html>
