<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Red Devils' Matchday Log</title>
</head>
<body style="margin:0;background:#14110D;color:#EFE4C8;font-family:system-ui,sans-serif">
<div id="boot" style="padding:40px 16px;text-align:center">Loading matchday log…</div>
<script type="module">
const REF = '77f6aaa38ae8e1f303dd67b8845323e0e00479e8';
const urls = [
  `https://cdn.jsdelivr.net/gh/kuzzzzz/mu-matchday-tracker@${REF}/index.html`,
  `https://raw.githack.com/kuzzzzz/mu-matchday-tracker/${REF}/index.html`,
  `https://raw.githubusercontent.com/kuzzzzz/mu-matchday-tracker/${REF}/index.html`
];
let html = null;
for (const u of urls) {
  try {
    const r = await fetch(u, { cache: 'no-store' });
    if (!r.ok) continue;
    html = await r.text();
    if (html.includes('mu-root') && html.includes('boot()')) break;
    html = null;
  } catch (_) {}
}
if (!html) {
  document.getElementById('boot').innerHTML = 'Could not load app. Open <a style="color:#C6A15B" href="https://github.com/kuzzzzz/mu-matchday-tracker/blob/77f6aaa38ae8e1f303dd67b8845323e0e00479e8/index.html">last good commit</a> and restore index.html.';
} else {
  document.open();
  document.write(html);
  document.close();
}
</script>
</body>
</html>
