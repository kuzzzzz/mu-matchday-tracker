canvas.confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

function defaultBannerSvg(){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8C0B20"/><stop offset="100%" stop-color="#241E17"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><text x="320" y="160" fill="#EFE4C8" font-family="Arial" font-size="28" text-anchor="middle" font-weight="700">MATCH HIGHLIGHTS</text><text x="320" y="200" fill="#C6A15B" font-family="Arial" font-size="16" text-anchor="middle">Tap to watch on YouTube</text></svg>`;return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
async function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}catch(_){}if(recordsRef)await set(recordsRef,records)}
async function searchHighlights(f){const queries=[`${f.opp} v Man Utd | Highlights`,`Man Utd v ${f.opp} | Highlights`,`Manchester United vs ${f.opp} Highlights`];for(const q of queries){try{const res=await fetch(`${PIPED}/search?q=${encodeURIComponent(q)}&filter=videos`);if(!res.ok)continue;const data=await res.json();const items=data.items||data||[];const streams=items.filter(it=>it.type==='stream'||(it.url||'').includes('watch'));const scored=streams.map(it=>{const id=(it.url||'').split('v=')[1]||it.id;const title=(it.title||'').toLowerCase(),up=(it.uploaderName||'').toLowerCase(),upUrl=it.uploaderUrl||'';let score=0;if(up.includes('manchester united')||upUrl.includes(MU_CHANNEL))score+=50;if(title.includes('highlight'))score+=30;if(title.includes('extended'))score+=5;if(normalizeName(title).includes(normalizeName(f.opp)))score+=20;if(it.duration&&it.duration<900)score+=10;if(it.duration&&it.duration>1800)score-=20;return{id,title:it.title,score}}).filter(x=>x.id).sort((a,b)=>b.score-a.score);if(scored[0]&&scored[0].score>=30){const best=scored[0],extended=scored.find(s=>s.id!==best.id&&/extended/i.test(s.title));return{id:best.id,extended:extended?.id||null}}}catch(e){console.warn(e)}}return null}
async function autoImportResults(){if(autoImportDone)return;autoImportDone=true;const today=new Date();today.setHours(23,59,59,999);const toCheck=FIXTURES.filter(f=>{const rec=records[f.id]||records[String(f.id)];return parseFixtureDate(f.date)<=today&&!(rec&&rec.mu!==undefined)});const dates=[...new Set(toCheck.map(f=>toYmd(parseFixtureDate(f.date))))];let changed=false;for(const ymd of dates){try{const res=await fetch(`${API_BASE}/scoreboard?dates=${ymd}`);if(!res.ok)continue;const data=await res.json();for(const ev of(data.events||[])){for(const c of(ev.competitions||[])){const competitors=c.competitors||[];const mu=competitors.find(x=>isManUnited(x.team));if(!mu)continue;const status=c.status?.type;if(!status?.completed&&status?.name!=='STATUS_FULL_TIME')continue;const oppSide=competitors.find(x=>x!==mu);const muScore=+mu.score,oppScore=+oppSide?.score;if(Number.isNaN(muScore)||Number.isNaN(oppScore))continue;const oppName=oppSide?.team?.displayName||oppSide?.team?.name||'';const fixture=FIXTURES.find(f=>toYmd(parseFixtureDate(f.date))===ymd&&namesMatch(f.opp,oppName));if(!fixture)continue;const key=String(fixture.id);if(records[key]?.mu!==undefined)continue;const known=HIGHLIGHT_IDS[fixture.id];records[key]={mu:muScore,opp:oppScore,auto:true,highlight:`Full time · ${oppName} ${oppScore}–${muScore} Man United.`,videoId:known?.id||null,videoExtended:known?.extended||null};changed=true}}}catch(e){console.warn(e)}}for(const f of FIXTURES){const key=String(f.id),rec=records[key];if(!rec||rec.mu===undefined)continue;if(HIGHLIGHT_IDS[f.id]&&!rec.videoId){rec.videoId=HIGHLIGHT_IDS[f.id].id;rec.videoExtended=HIGHLIGHT_IDS[f.id].extended||null;changed=true}if(!rec.videoId){const found=await searchHighlights(f);if(found){rec.videoId=found.id;rec.videoExtended=found.extended;changed=true}}}if(changed){try{await saveData()}catch(_){}}}
async function fetchStandings(){try{const res=await fetch(`${API_BASE}/standings?season=2026`);if(!res.ok)return;const data=await res.json();const entries=data?.children?.[0]?.standings?.entries||[];standings=entries.map(e=>{const stats={};(e.stats||[]).forEach(s=>{stats[s.name]=s.displayValue});return{name:e.team?.displayName||e.team?.name||'?',rank:+stats.rank||0,p:+stats.gamesPlayed||0,gd:+stats.pointDifferential||0,pts:+stats.points||0,isMu:isManUnited(e.team)}}).sort((a,b)=>a.rank-b.rank);muTable=standings.find(s=>s.isMu)||null}catch(e){console.warn(e)}}
async function fetchNews(next){const queries=[];if(next){queries.push(`Manchester United ${next.opp} when:14d`);queries.push(`"Man United" OR "Manchester United" preview ${next.opp} when:14d`)}queries.push('Manchester United team news when:7d');const items=[],seen=new Set();for(const q of queries){try{const rss=`https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=en-GB&gl=GB&ceid=GB:en`;const res=await fetch(RSS2JSON+encodeURIComponent(rss));if(!res.ok)continue;const data=await res.json();for(const it of(data.items||[]).slice(0,6)){const title=it.title||'';if(seen.has(title))continue;seen.add(title);let src=it.author||'',clean=title;const dash=title.lastIndexOf(' - ');if(dash>0){src=title.slice(dash+3);clean=title.slice(0,dash)}items.push({title:clean,link:it.link,source:src,date:it.pubDate})}}catch(e){console.warn(e)}if(items.length>=8)break}newsItems=items.slice(0,8)}
function nextUnplayed(){return FIXTURES.find(f=>{const rec=records[f.id]||records[String(f.id)];return!(rec&&rec.mu!==undefined)})||null}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return s[(v-20)%10]||s[v]||s[0]}
function buildupNotes(next){if(!next)return['Season complete.'];const d=parseFixtureDate(next.date),now=new Date();now.setHours(0,0,0,0);const days=Math.round((d-now)/86400000),home=next.venue==='H',notes=[];if(days<0)notes.push(`GW${next.gw} vs ${next.opp} — score import pending.`);else if(days===0)notes.push(`Matchday · ${home?'Old Trafford':'Away'} vs ${next.opp}.`);else if(days===1)notes.push('MD-1: taper · set-piece walkthrough.');else if(days<=3)notes.push(`MD-${days}: recovery then shape vs ${next.opp}.`);else notes.push(`${days} days until ${home?'home':'away'} vs ${next.opp}.`);if(muTable)notes.push(`Table: ${muTable.rank}${ordinal(muTable.rank)} · ${muTable.pts} pts · GD ${muTable.gd>=0?'+':''}${muTable.gd}.`);const outs=(injuries.players||[]).filter(p=>p.status==='out').map(p=>p.name);if(outs.length)notes.push('Out: '+outs.join(', ')+'.');return notes}
function renderNews(){if(!newsItems.length)return`<div class="panel wide"><h2>Matchday news</h2><div style="color:var(--grey);font-size:12px">Loading headlines…</div></div>`;return`<div class="panel wide"><h2>Matchday news & build-up</h2><ul class="news-list">${newsItems.map(n=>`<li><a href="${escapeHtml(n.link)}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a><span class="src">${escapeHtml(n.source||'News')}${n.date?' · '+new Date(n.date).toLocaleDateString():''}</span></li>`).join('')}</ul></div>`}
function renderInjuries(){const list=(injuries.players||[]).map(p=>{const badge=p.status==='out'?'out':p.status==='doubt'?'doubt':'ok';const label=p.status==='out'?'Out':p.status==='doubt'?'Doubt':'OK';return`<li><span class="player">${escapeHtml(p.name)}</span><span class="badge ${badge}">${label}</span><span class="reason">${escapeHtml(p.reason)}${p.return&&p.return!=='TBC'?' · ~'+escapeHtml(p.return):''}${p.note?' — '+escapeHtml(p.note):''}</span></li>`}).join('');return`<div class="panel"><h2>Squad availability</h2><ul class="injury-list">${list}</ul><a class="src-link" href="${escapeHtml(injuries.source||'#')}" target="_blank" rel="noopener">Premier Injuries · ${escapeHtml(injuries.updated||'')}</a></div>`}
function renderBuildup(){const next=nextUnplayed(),notes=buildupNotes(next);const tableRows=standings.slice(0,8).map(s=>`<tr class="${s.isMu?'mu':''}"><td class="pos">${s.rank}</td><td>${escapeHtml(s.name)}${s.isMu?' ★':''}</td><td class="num">${s.p}</td><td class="num">${s.gd>=0?'+':''}${s.gd}</td><td class="pts">${s.pts}</td></tr>`).join('');let extra='';if(muTable&&muTable.rank>8)extra=`<tr class="mu"><td class="pos">${muTable.rank}</td><td>${escapeHtml(muTable.name)} ★</td><td class="num">${muTable.p}</td><td class="num">${muTable.gd>=0?'+':''}${muTable.gd}</td><td class="pts">${muTable.pts}</td></tr>`;return`<div class="buildup"><div class="panel"><h2>Premier League table</h2>${standings.length?`<table class="standings-table"><thead><tr><th class="pos">#</th><th>Club</th><th class="num">P</th><th class="num">GD</th><th class="pts">Pts</th></tr></thead><tbody>${tableRows}${extra}</tbody></table>`:`<div style="color:var(--grey);font-size:12px">Loading…</div>`}</div><div class="panel"><h2>Matchday build-up</h2>${next?`<div class="next-match-line">Next · GW${next.gw} vs ${escapeHtml(next.opp)}</div><div class="next-meta">${escapeHtml(next.date)} · ${next.venue==='H'?'Home':'Away'} · ${next.comp}</div>`:`<div class="next-match-line">No fixtures left</div>`}<ul class="buildup-notes">${notes.map(n=>`<li>${escapeHtml(n)}</li>`).join('')}</ul></div>${renderInjuries()}${renderNews()}</div>`}
function videoBanner(f,rec){const id=rec?.videoId||HIGHLIGHT_IDS[f.id]?.id;const extended=rec?.videoExtended||HIGHLIGHT_IDS[f.id]?.extended;const href=id?ytWatch(id):ytSearchUrl(f);const img=id?ytThumb(id):defaultBannerSvg();return`<a class="vid-banner" href="${href}" target="_blank" rel="noopener"><img src="${img}" alt="Highlights" loading="lazy" onerror="this.src='${defaultBannerSvg()}'"/><div class="play"><div class="circle">▶</div><span>${id?'Watch highlights':'Find highlights'}</span></div></a><div class="vid-links"><a href="${href}" target="_blank" rel="noopener">Open on YouTube</a>${extended?`<a href="${ytWatch(extended)}" target="_blank" rel="noopener">Extended</a>`:''}<a href="${ytSearchUrl(f)}" target="_blank" rel="noopener">More results</a></div>`}
function fanCount(fid){return(discussions[String(fid)]||[]).length}
function fanIconBtn(f){const n=fanCount(f.id);return`<button type="button" class="fan-btn" data-open-fan="${f.id}" title="Fans">${n?'💬':(records[f.id]||records[String(f.id)])?.mu!==undefined?'💬':'🎯'}${n?`<span class="cnt">${n}</span>`:''}</button>`}
function renderDialog(){if(openDialogFid==null)return'';const f=FIXTURES.find(x=>x.id===openDialogFid);if(!f)return'';const rec=records[f.id]||records[String(f.id)];const played=rec&&rec.mu!==undefined;const list=(discussions[String(f.id)]||[]).slice().reverse();const nick=localStorage.getItem(NICK_KEY)||'';const preds=list.filter(c=>c.type==='prediction');const comments=list.filter(c=>c.type!=='prediction');const items=played?comments:preds;const title=played?`Match chat · GW${f.gw}`:`Predict · GW${f.gw}`;const sub=`Man United ${f.venue==='H'?'vs':'@'} ${f.opp}`;let listHtml='';if(!items.length)listHtml=`<div class="empty">${played?'No comments yet — be the first.':'No predictions yet — set the scoreline.'}</div>`;else listHtml=items.map(c=>{if(c.type==='prediction')return`<div class="comment"><span class="who">${escapeHtml(c.nick||'Fan')}</span><span class="when">${c.ts?new Date(c.ts).toLocaleString():''}</span><div><span class="pred-score">${c.mu} – ${c.opp}</span>${c.text?' · '+escapeHtml(c.text):''}</div></div>`;return`<div class="comment"><span class="who">${escapeHtml(c.nick||'Fan')}</span><span class="when">${c.ts?new Date(c.ts).toLocaleString():''}</span><div>${escapeHtml(c.text||'')}</div></div>`}).join('');const form=played?`<form id="fan-dialog-form" data-mode="comment" data-fid="${f.id}"><input name="nick" maxlength="24" placeholder="Your name / handle" value="${escapeHtml(nick)}" required/><textarea name="text" maxlength="400" placeholder="Thoughts on this game…" required></textarea><button type="submit">Post comment</button></form>`:`<form id="fan-dialog-form" data-mode="prediction" data-fid="${f.id}"><input name="nick" maxlength="24" placeholder="Your name / handle" value="${escapeHtml(nick)}" required/><div class="pred-row"><span class="mu-mono">MUFC</span><input type="number" name="mu" min="0" max="20" placeholder="-" required/><span>:</span><input type="number" name="opp" min="0" max="20" placeholder="-" required/><span class="mu-mono">${escapeHtml(f.opp).slice(0,4).toUpperCase()}</span></div><input name="text" maxlength="200" placeholder="Optional note (e.g. MotM, scoreline theory)"/><button type="submit">Lock prediction</button></form>`;return`<div class="modal-backdrop" id="fan-modal"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h3>${title}</h3><div class="sub">${escapeHtml(sub)}</div></div><button type="button" class="modal-close" id="fan-modal-close" aria-label="Close">×</button></div><div class="modal-body">${listHtml}</div><div class="modal-foot">${form}</div></div></div>`}
function renderTicket(f){const rec=records[f.id]||records[String(f.id)],played=rec&&rec.mu!==undefined,venueLabel=f.venue==='H'?'Home':'Away';if(played){const r=resultFor(rec);return`<div class="ticket"><div class="stub">GW ${f.gw} · ${f.comp}</div><div class="body stamp-block"><div class="result-stamp ${r}">${r==='W'?'WIN':r==='D'?'DRAW':'LOSS'}</div><div class="row1"><span class="gw">Matchday ${f.gw}</span><span class="comp">${f.comp==='PL'?'Prem':f.comp}</span></div><div class="date">${f.date} · ${venueLabel}</div><div class="fixture-line">Man United <span class="venue-tag">${f.venue}</span> vs ${f.opp}</div><div class="final-score">${rec.mu} – ${rec.opp}</div>${rec.auto?'<div class="auto-tag">Auto score</div>':''}<div class="highlight-display ${rec.highlight?'':'empty'}">${rec.highlight?escapeHtml(rec.highlight):'No note.'}</div>${videoBanner(f,rec)}<div class="card-actions">${fanIconBtn(f)}<button class="edit-link" id="edit-${f.id}">Edit result</button></div></div></div>`}return`<div class="ticket"><div class="stub">GW ${f.gw} · ${f.comp}</div><div class="body"><div class="row1"><span class="gw">Matchday ${f.gw}</span><span class="comp">${f.comp==='PL'?'Prem':f.comp}</span></div><div class="date">${f.date} · ${venueLabel}</div><div class="fixture-line">Man United <span class="venue-tag">${f.venue}</span> vs ${f.opp}</div><div class="score-form"><span class="mu-mono">MUFC</span><input type="number" min="0" id="mu-${f.id}" placeholder="-"/><span class="vs">:</span><input type="number" min="0" id="opp-${f.id}" placeholder="-"/><span class="mu-mono">${escapeHtml(f.opp).slice(0,4).toUpperCase()}</span></div><textarea class="highlight-input" id="hl-${f.id}" placeholder="Optional note for your prediction...">${rec&&rec.highlight?escapeHtml(rec.highlight):''}</textarea><div class="card-actions">${fanIconBtn(f)}<button class="save-btn" id="save-${f.id}">${isMatchFinished(f)?'Stamp result':'Lock prediction'}</button></div></div></div>`}
function bindDialog(){const backdrop=document.getElementById('fan-modal');if(!backdrop)return;const close=()=>{openDialogFid=null;render()};document.getElementById('fan-modal-close')?.addEventListener('click',close);backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}});const form=document.getElementById('fan-dialog-form');if(!form)return;form.addEventListener('submit',async e=>{e.preventDefault();const fid=form.dataset.fid,mode=form.dataset.mode;const nick=(form.nick.value||'').trim().slice(0,24);if(!nick)return;localStorage.setItem(NICK_KEY,nick);let payload;if(mode==='prediction'){const mu=form.mu.value,opp=form.opp.value;if(mu===''||opp==='')return;payload={type:'prediction',nick,mu:+mu,opp:+opp,text:(form.text.value||'').trim().slice(0,200),ts:Date.now()}}else{const text=(form.text.value||'').trim().slice(0,400);if(!text)return;payload={type:'comment',nick,text,ts:Date.now()}}if(discussRef){try{await push(ref(db,`discuss/${fid}`),payload)}catch(err){console.warn(err);alert('Could not post — check Firebase rules for /discuss')}}else{const key=String(fid);discussions[key]=discussions[key]||[];discussions[key].push(payload);render()}})}
function render(){const stats=computeStats();const visible=FIXTURES.filter(f=>{const rec=records[f.id]||records[String(f.id)],played=rec&&rec.mu!==undefined;if(filter==='played')return played;if(filter==='upcoming')return!played;return true});root.innerHTML=`<div class="mu-header"><div class="eyebrow">Traouse Presents</div><h1 class="mu-display">The Red <span>Devils'</span> Matchday Log</h1><div class="season">2026/27 · auto scores · highlights · news · fans</div></div>${loadError?`<div class="err-banner">${escapeHtml(loadError)}</div>`:''}<div class="scoreboard"><div class="flip"><div class="val">${stats.p}</div><div class="lab">Played</div></div><div class="flip"><div class="val">${stats.w}</div><div class="lab">Won</div></div><div class="flip"><div class="val">${stats.d}</div><div class="lab">Drawn</div></div><div class="flip"><div class="val">${stats.l}</div><div class="lab">Lost</div></div><div class="flip"><div class="val">${stats.gf}</div><div class="lab">Goals For</div></div><div class="flip"><div class="val">${stats.ga}</div><div class="lab">Goals Against</div></div><div class="flip"><div class="val">${stats.gd>0?'+':''}${stats.gd}</div><div class="lab">Gl Diff</div></div><div class="flip"><div class="val">${stats.pts}</div><div class="lab">Points</div></div></div><div class="streak-line">Current form <span class="pips">${stats.streak.length?stats.streak.map(r=>`<span class="pip ${r}">${r}</span>`).join(''):'<span style="color:var(--grey);font-size:11px">no results yet</span>'}</span></div>${renderBuildup()}<div class="tabs"><button class="tab ${filter==='all'?'active':''}" data-f="all">All 38</button><button class="tab ${filter==='played'?'active':''}" data-f="played">Played (${stats.p})</button><button class="tab ${filter==='upcoming'?'active':''}" data-f="upcoming">Upcoming (${38-stats.p})</button></div><div class="tickets">${visible.length?visible.map(renderTicket).join(''):'<div class="empty-state">Nothing here yet.</div>'}</div>${renderDialog()}`;root.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.f;render()}));root.querySelectorAll('[data-open-fan]').forEach(btn=>btn.addEventListener('click',()=>{openDialogFid=+btn.dataset.openFan;render()}));visible.forEach(f=>{const saveBtn=root.querySelector(`#save-${f.id}`),editBtn=root.querySelector(`#edit-${f.id}`);if(saveBtn){saveBtn.addEventListener('click',async()=>{const muVal=root.querySelector(`#mu-${f.id}`).value,oppVal=root.querySelector(`#opp-${f.id}`).value,hlVal=root.querySelector(`#hl-${f.id}`).value;if(muVal===''||oppVal==='')return;saveBtn.disabled=true;try{if(!isMatchFinished(f)){await postPrediction(f.id,muVal,oppVal,hlVal);openDialogFid=f.id;render();return}const known=HIGHLIGHT_IDS[f.id];records[String(f.id)]={mu:+muVal,opp:+oppVal,highlight:hlVal,auto:false,videoId:known?.id||null,videoExtended:known?.extended||null};if(!records[String(f.id)].videoId){const found=await searchHighlights(f);if(found){records[String(f.id)].videoId=found.id;records[String(f.id)].videoExtended=found.extended}}await saveData();render();if(resultFor(records[String(f.id)])==='W')fireConfetti()}catch(_){saveBtn.disabled=false}})}if(editBtn){editBtn.addEventListener('click',async()=>{delete records[String(f.id)];await saveData();render()})}});bindDialog()}
async function seedInjuries(){if(injuriesRef){try{await set(injuriesRef,DEFAULT_INJURIES)}catch(_){}}}
async function boot(){render();if(recordsRef){onValue(recordsRef,async snap=>{const val=snap.val();records=val&&typeof val==='object'?val:{};const n={};Object.keys(records).forEach(k=>{n[String(k)]=records[k]});records=n;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}catch(_){}render();await fetchStandings();await autoImportResults();await fetchNews(nextUnplayed());render()},err=>{loadError=err.message||'Firebase read failed';render()})}else{try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)records=JSON.parse(raw)}catch(_){}await fetchStandings();await autoImportResults();await fetchNews(nextUnplayed());render()}if(injuriesRef){onValue(injuriesRef,snap=>{const val=snap.val();if(val&&val.players)injuries=val;else seedInjuries();render()})}if(discussRef){onValue(discussRef,snap=>{const val=snap.val()||{};discussions={};Object.keys(val).forEach(fid=>{const obj=val[fid]||{};discussions[fid]=Object.keys(obj).map(k=>({id:k,...obj[k]})).sort((a,b)=>(a.ts||0)-(b.ts||0))});render()})}}
boot();
</script>
